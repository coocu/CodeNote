<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Android 얼굴인식 등록과 출석 화면 예시</title>
  <desc id="desc">출석관리 화면의 얼굴인식 등록 버튼, 학생 선택과 6회 등록, 자동 인식 결과를 보여주는 예시 화면</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3478f6"/><stop offset="1" stop-color="#2457dd"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173a72" flood-opacity=".12"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#13233f}
      .muted{fill:#6d7d96}.blue{fill:#2368e8}.red{fill:#df3838}.bold{font-weight:700}.small{font-size:18px}.tiny{font-size:15px}
    </style>
  </defs>
  <rect width="1440" height="900" rx="34" fill="url(#bg)"/>
  <text x="62" y="70" font-size="24" class="blue bold">ANDROID FACE ATTENDANCE</text>
  <text x="62" y="116" font-size="36" class="bold">얼굴 등록부터 자동 입실·퇴실까지</text>
  <text x="1378" y="80" text-anchor="end" font-size="17" class="muted">화면 예시</text>

  <g filter="url(#shadow)">
    <rect x="55" y="155" width="390" height="680" rx="30" fill="#fff" stroke="#dce6f4"/>
    <rect x="79" y="181" width="342" height="50" rx="14" fill="#f6f8fc"/>
    <text x="99" y="213" font-size="21" class="bold">출석관리</text><circle cx="390" cy="206" r="7" fill="#22c55e"/>
    <text x="99" y="269" font-size="18" class="muted">NFC 카드를 태그하거나</text>
    <text x="99" y="295" font-size="18" class="muted">출석번호 4자리를 입력하세요.</text>
    <rect x="92" y="318" width="316" height="50" rx="14" fill="#f8fafc" stroke="#d8e1ef"/>
    <text x="250" y="350" text-anchor="middle" font-size="19" fill="#a2acba">출석번호 4자리</text>
    <g font-size="23" class="blue bold" text-anchor="middle">
      <g fill="#f8fafc" stroke="#d8e1ef">
        <rect x="92" y="386" width="94" height="62" rx="15"/><rect x="202" y="386" width="94" height="62" rx="15"/><rect x="312" y="386" width="96" height="62" rx="15"/>
        <rect x="92" y="462" width="94" height="62" rx="15"/><rect x="202" y="462" width="94" height="62" rx="15"/><rect x="312" y="462" width="96" height="62" rx="15"/>
        <rect x="92" y="538" width="94" height="62" rx="15"/><rect x="202" y="538" width="94" height="62" rx="15"/><rect x="312" y="538" width="96" height="62" rx="15"/>
      </g>
      <text x="139" y="425">1</text><text x="249" y="425">2</text><text x="360" y="425">3</text>
      <text x="139" y="501">4</text><text x="249" y="501">5</text><text x="360" y="501">6</text>
      <text x="139" y="577">7</text><text x="249" y="577">8</text><text x="360" y="577">9</text>
    </g>
    <rect x="92" y="625" width="316" height="52" rx="14" fill="#fff" stroke="#bed0e8"/>
    <text x="250" y="658" text-anchor="middle" font-size="18" class="bold">NFC 리더기 연결</text>
    <rect x="92" y="691" width="316" height="52" rx="14" fill="url(#blue)"/>
    <text x="250" y="724" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">얼굴인식 등록</text>
    <rect x="108" y="765" width="284" height="44" rx="22" fill="#eef7ff"/>
    <circle cx="139" cy="787" r="8" fill="#22c55e"/><text x="160" y="793" font-size="17" class="blue bold">얼굴인식 대기 중</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="155" width="430" height="680" rx="30" fill="#fff" stroke="#dce6f4"/>
    <text x="505" y="204" font-size="25" class="bold">얼굴인식 등록</text>
    <text x="875" y="202" text-anchor="end" font-size="16" class="muted">학생 선택</text>
    <rect x="505" y="229" width="370" height="48" rx="14" fill="#f7f9fc" stroke="#dce6f4"/>
    <text x="529" y="260" font-size="17" class="muted">학생 이름 검색</text>
    <rect x="505" y="294" width="370" height="64" rx="16" fill="#edf4ff" stroke="#a9c6f4"/>
    <circle cx="541" cy="326" r="19" fill="#d4e4ff"/><text x="541" y="333" text-anchor="middle" font-size="17" class="blue bold">김</text>
    <text x="575" y="322" font-size="18" class="bold">김민경</text><text x="575" y="345" font-size="14" class="muted">얼굴 미등록</text>
    <circle cx="843" cy="326" r="12" fill="#2563eb"/><path d="M838 326l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="505" y="375" width="370" height="267" rx="20" fill="#0f2345"/>
    <circle cx="690" cy="477" r="61" fill="#d9e7ff"/>
    <circle cx="690" cy="451" r="28" fill="#89a9d8"/><path d="M635 529c10-39 100-39 110 0" fill="#89a9d8"/>
    <path d="M596 420v-20h22M784 420v-20h-22M596 582v20h22M784 582v20h-22" fill="none" stroke="#74a5ff" stroke-width="5" stroke-linecap="round"/>
    <text x="690" y="622" text-anchor="middle" font-size="16" fill="#dbe8ff">정면을 보고 잠시 멈춰주세요</text>
    <g>
      <circle cx="590" cy="671" r="13" fill="#2563eb"/><circle cx="630" cy="671" r="13" fill="#2563eb"/><circle cx="670" cy="671" r="13" fill="#2563eb"/>
      <circle cx="710" cy="671" r="13" fill="#dbe6f5"/><circle cx="750" cy="671" r="13" fill="#dbe6f5"/><circle cx="790" cy="671" r="13" fill="#dbe6f5"/>
    </g>
    <text x="690" y="713" text-anchor="middle" font-size="18" class="bold">총 6회 자동 등록</text>
    <rect x="505" y="735" width="164" height="42" rx="21" fill="#2563eb"/><text x="587" y="762" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">일반 등록</text>
    <rect x="681" y="735" width="194" height="42" rx="21" fill="#fff" stroke="#b9c9df"/><text x="778" y="762" text-anchor="middle" font-size="16" class="bold">안경 착용·미착용</text>
    <text x="690" y="811" text-anchor="middle" font-size="16" class="red bold">일란성 쌍둥이는 얼굴등록을 금지합니다.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="935" y="155" width="450" height="680" rx="30" fill="#fff" stroke="#dce6f4"/>
    <text x="970" y="204" font-size="25" class="bold">자동 인식 흐름</text>
    <rect x="970" y="232" width="380" height="194" rx="22" fill="#10294b"/>
    <path d="M1068 282v-18h20M1252 282v-18h-20M1068 376v18h20M1252 376v18h-20" fill="none" stroke="#71a1ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1160" cy="320" r="37" fill="#bfd2f1"/><path d="M1096 389c12-44 116-44 128 0" fill="#7f9fcf"/>
    <text x="1160" y="408" text-anchor="middle" font-size="15" fill="#dbe8ff">카메라 미리보기 없이 자동 대기</text>
    <path d="M1160 441v34" stroke="#93a5bd" stroke-width="3"/><path d="M1151 466l9 10 9-10" fill="none" stroke="#93a5bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="970" y="493" width="380" height="86" rx="18" fill="#ecfdf5" stroke="#a7e7ca"/>
    <circle cx="1013" cy="536" r="21" fill="#22c55e"/><path d="M1003 536l7 7 13-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1048" y="529" font-size="16" class="muted">김민경 학생</text><text x="1048" y="556" font-size="22" fill="#118551" font-weight="700">입실되었습니다</text>
    <rect x="970" y="596" width="380" height="86" rx="18" fill="#eef5ff" stroke="#bed2f4"/>
    <circle cx="1013" cy="639" r="21" fill="#2563eb"/><path d="M1003 639l7 7 13-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1048" y="632" font-size="16" class="muted">김민경 학생</text><text x="1048" y="659" font-size="22" class="blue bold">퇴실되었습니다</text>
    <rect x="970" y="704" width="380" height="101" rx="18" fill="#f8fafc" stroke="#dce6f4"/>
    <text x="995" y="738" font-size="17" class="bold">기기 내부 처리</text>
    <text x="995" y="767" font-size="15" class="muted">원본 사진 미저장 · 특징정보 암호화</text>
    <text x="995" y="791" font-size="15" class="muted">얼굴정보 서버 전송 없음</text>
  </g>
</svg>
