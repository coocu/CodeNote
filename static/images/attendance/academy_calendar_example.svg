<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">학원 일정과 휴원 월간 캘린더 예시</title>
  <desc id="desc">기간 일정은 여러 날짜에 걸친 하나의 막대로 가운데 표시하고 휴원일은 각 날짜에 휴원으로 표시한 월간 캘린더</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173a72" flood-opacity=".11"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#13233f}.muted{fill:#6d7d96}.blue{fill:#2563eb}.red{fill:#dc3434}.bold{font-weight:700}
    </style>
  </defs>
  <rect width="1440" height="900" rx="34" fill="url(#bg)"/>
  <text x="60" y="68" font-size="24" class="blue bold">ACADEMY SCHEDULE</text>
  <text x="60" y="114" font-size="36" class="bold">학원 일정·휴원을 월간 캘린더로</text>
  <text x="1380" y="78" text-anchor="end" font-size="17" class="muted">화면 예시</text>
