  <g filter="url(#shadow)">
    <rect x="1127" y="148" width="261" height="700" rx="28" fill="#fff" stroke="#dce6f4"/>
    <text x="1160" y="202" font-size="23" class="bold">표시 원칙</text>
    <circle cx="1164" cy="250" r="16" fill="#2563eb"/><text x="1164" y="256" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">1</text>
    <text x="1194" y="246" font-size="16" class="bold">기간 일정</text><text x="1194" y="271" font-size="14" class="muted">막대 가운데 표시</text>
    <circle cx="1164" cy="327" r="16" fill="#dc3434"/><text x="1164" y="333" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">2</text>
    <text x="1194" y="323" font-size="16" class="bold">휴원일</text><text x="1194" y="348" font-size="14" class="muted">날짜마다 휴원 표시</text>
    <circle cx="1164" cy="404" r="16" fill="#dc3434"/><text x="1164" y="410" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">3</text>
    <text x="1194" y="400" font-size="16" class="bold">빨간색</text><text x="1194" y="425" font-size="14" class="muted">일·공휴일·휴원</text>
    <circle cx="1164" cy="481" r="16" fill="#2563eb"/><text x="1164" y="487" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">4</text>
    <text x="1194" y="477" font-size="16" class="bold">파란색</text><text x="1194" y="502" font-size="14" class="muted">토요일</text>
    <rect x="1152" y="554" width="211" height="119" rx="18" fill="#eef5ff"/>
    <text x="1172" y="586" font-size="16" class="blue bold">학부모 조회</text>
    <text x="1172" y="616" font-size="14" class="muted">학원 선택 후</text><text x="1172" y="640" font-size="14" class="muted">이전·현재·다음 달</text><text x="1172" y="664" font-size="14" class="muted">조회 전용</text>
    <rect x="1152" y="693" width="211" height="119" rx="18" fill="#10294b"/>
    <text x="1172" y="726" font-size="16" fill="#fff" font-weight="700">지난 기록 보호</text>
    <text x="1172" y="757" font-size="14" fill="#dce8fa">과거 일정은 조회만</text><text x="1172" y="781" font-size="14" fill="#dce8fa">가능하며 그대로 유지</text>
