      <rect x="286" y="203" width="407" height="27" rx="9" fill="#e8efff"/>
      <text x="489.5" y="222" text-anchor="middle" font-size="15" class="blue bold">가을방학</text>
      <rect x="568" y="287" width="407" height="27" rx="9" fill="#ffeded"/>
      <text x="771.5" y="306" text-anchor="middle" font-size="15" class="red bold">추석 연휴</text>
