    <rect x="82" y="177" width="475" height="58" rx="17" fill="#356df3"/>
    <text x="320" y="214" text-anchor="middle" font-size="21" fill="#fff" font-weight="700">일정 등록</text>
    <rect x="572" y="177" width="495" height="58" rx="17" fill="#eef3ff"/>
    <text x="820" y="214" text-anchor="middle" font-size="21" class="blue bold">휴원 등록</text>
    <rect x="417" y="257" width="58" height="52" rx="15" fill="#eef3ff"/><text x="446" y="291" text-anchor="middle" font-size="30" class="blue">‹</text>
    <text x="575" y="291" text-anchor="middle" font-size="25" class="bold">2026년 9월</text>
    <rect x="676" y="257" width="58" height="52" rx="15" fill="#eef3ff"/><text x="705" y="291" text-anchor="middle" font-size="30" class="blue">›</text>

