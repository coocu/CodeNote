        <rect x="290" y="177" width="125" height="25" rx="8" fill="#ffeded"/><text x="302" y="195">휴원</text>
        <rect x="431" y="177" width="125" height="25" rx="8" fill="#ffeded"/><text x="443" y="195">휴원</text>
        <rect x="572" y="177" width="125" height="25" rx="8" fill="#ffeded"/><text x="584" y="195">휴원</text>
        <rect x="854" y="262" width="125" height="25" rx="8" fill="#ffeded"/><text x="866" y="280">휴원</text>
        <rect x="8" y="347" width="125" height="25" rx="8" fill="#ffeded"/><text x="20" y="365">휴원</text>
        <rect x="572" y="347" width="125" height="25" rx="8" fill="#ffeded"/><text x="584" y="365">휴원</text>
        <rect x="713" y="347" width="125" height="25" rx="8" fill="#ffeded"/><text x="725" y="365">휴원</text>
        <rect x="854" y="347" width="125" height="25" rx="8" fill="#ffeded"/><text x="866" y="365">휴원</text>
        <rect x="8" y="432" width="125" height="25" rx="8" fill="#ffeded"/><text x="20" y="450">휴원</text>
